services:
  app:
    build: .
    image: station-app
    environment:
      PORT: "8000"
      DATA_DIR: /data
      # 追加受信根公钥（逗号分隔的 hex），生产环境务必配置：
      # TRUSTED_ROOTS: "abcd...,ef01..."
      # 置 0 可停用内置演练根密钥：
      # DEMO_ROOT_ENABLED: "0"
    volumes:
      - station-data:/data
    ports:
      - "${HOST_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys,os;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/healthz',timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    build: .
    image: station-app
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8000
      APP_ROOT: /srv
    command: ["python", "-m", "verify.verify"]
    restart: "no"

volumes:
  station-data:
